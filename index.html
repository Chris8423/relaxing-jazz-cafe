<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的文章庫 (雲端同步三層結構版)</title>
  <!-- 引入 Mammoth.js 用於解析 Word (.docx) 檔案 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #121212;
      --bg-sidebar: #1e1e1e;
      --bg-card: #252526;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --accent-color: #4fc3f7;
      --border-color: #333333;
      --hover-color: #2a2d2e;
      --danger-color: #ff5252;
      --lock-color: #ffd54f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 左側邊欄 */
    .sidebar {
      width: 320px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 15px;
    }

    .status-badge {
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      margin-bottom: 12px;
      display: inline-block;
    }

    .file-upload-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: var(--accent-color);
      color: #121212;
      font-weight: 600;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .file-upload-btn:hover {
      opacity: 0.9;
    }

    .file-input {
      display: none;
    }

    .article-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    /* 三層式結構樣式 */
    .category-section {
      margin-bottom: 10px;
    }

    .category-title-bar {
      padding: 8px 10px;
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--accent-color);
      background: rgba(79, 195, 247, 0.08);
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .book-group {
      margin-left: 10px;
      margin-top: 4px;
      border-left: 1px dashed var(--border-color);
      padding-left: 8px;
    }

    .book-header {
      padding: 8px 10px;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-main);
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      transition: background 0.2s;
    }

    .book-header:hover {
      background-color: var(--hover-color);
    }

    .chapter-list {
      padding-left: 12px;
      margin-top: 2px;
      display: block;
    }

    .chapter-list.collapsed {
      display: none;
    }

    .chapter-item {
      padding: 6px 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: all 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chapter-item:hover {
      background-color: var(--hover-color);
      color: var(--text-main);
    }

    .chapter-item.active {
      background-color: var(--hover-color);
      color: var(--accent-color);
      font-weight: 600;
      border-left: 3px solid var(--accent-color);
    }

    /* 右側主內容區 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-dark);
      overflow: hidden;
    }

    .top-bar {
      padding: 15px 30px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-sidebar);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .chapter-select {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .top-bar-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--hover-color);
    }

    .btn-danger {
      color: var(--danger-color);
      border-color: rgba(255, 82, 82, 0.3);
    }

    .btn-danger:hover {
      background: rgba(255, 82, 82, 0.1);
    }

    .btn-lock {
      color: var(--lock-color);
      border-color: rgba(255, 213, 79, 0.3);
    }

    .btn-lock:hover {
      background: rgba(255, 213, 79, 0.1);
    }

    .article-container {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .article-header {
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    .article-title {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .article-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .private-tag {
      background-color: rgba(255, 213, 79, 0.2);
      color: var(--lock-color);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .article-body {
      line-height: 1.8;
      font-size: 1.05rem;
      color: var(--text-main);
    }

    .article-body p {
      margin-bottom: 1.2rem;
    }

    .empty-state {
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- 左側邊欄 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">📚 我的文章庫</div>
      <div id="statusBadge" class="status-badge">🔄 連線資料庫中...</div>
      <label class="file-upload-btn">
        📂 匯入 Word (.docx)
        <input type="file" id="fileInput" class="file-input" accept=".docx">
      </label>
    </div>
    <div class="article-list" id="articleList">
      <!-- 三層樹狀清單由 JS 動態生成 -->
    </div>
  </div>

  <!-- 右側文章閱讀區 -->
  <div class="main-content">
    <div class="top-bar">
      <div class="top-bar-left">
        <div id="currentPath" style="font-size: 0.9rem; color: var(--text-muted);">尚未選擇文章</div>
        <select id="topChapterSelect" class="chapter-select" style="display: none;">
          <option value="">選擇章節...</option>
        </select>
      </div>
      <div class="top-bar-right">
        <button id="lockToggleBtn" class="btn btn-lock">🔒 解鎖私密區</button>
        <button id="togglePrivateBtn" class="btn" style="display: none;">🔒 設為私密文章</button>
        <button id="deleteBtn" class="btn btn-danger" style="display: none;">🗑️ 刪除文章</button>
      </div>
    </div>

    <div id="articleContainer" class="article-container">
      <div class="empty-state">請從左側選擇文章閱讀，或點擊匯入 Word 檔案。</div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. Supabase 設定
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://ymeibcxmujfuoactfpot.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_4fM-yRhN4FISf3UPtyMfUA_yX2F00ru";

    window.supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      global: { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
    });
    const dbClient = window.supabaseClient;

    // -------------------------------------------------------------
    // 2. 狀態設定
    // -------------------------------------------------------------
    let SECRET_PASSWORD = "320137";
    let isUnlocked = false;

    let articlesData = [];
    let currentArticleId = null;
    let currentChapterIndex = 0;
    let collapsedBooks = new Set(); // 記錄摺疊的書名

    const fileInput = document.getElementById('fileInput');
    const articleList = document.getElementById('articleList');
    const articleContainer = document.getElementById('articleContainer');
    const statusBadge = document.getElementById('statusBadge');
    const deleteBtn = document.getElementById('deleteBtn');
    const togglePrivateBtn = document.getElementById('togglePrivateBtn');
    const lockToggleBtn = document.getElementById('lockToggleBtn');
    const currentPath = document.getElementById('currentPath');
    const topChapterSelect = document.getElementById('topChapterSelect');

    // -------------------------------------------------------------
    // 3. 載入資料
    // -------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      fetchArticlesFromSupabase();
    });

    async function fetchArticlesFromSupabase() {
      try {
        statusBadge.textContent = "🔄 連線中...";
        const { data, error } = await dbClient
          .from('articles')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        articlesData = (data || []).map(art => {
          let parsedChapters = [];
          if (Array.isArray(art.chapters) && art.chapters.length > 0) {
            parsedChapters = art.chapters;
          } else if (art.content) {
            parsedChapters = parseHtmlToChapters(art.content, art.title || "全文");
          } else {
            parsedChapters = [{ title: "全文", content: "無內容" }];
          }

          // 自動解析檔名格式：分類_書名_章節範圍 (例如 娛樂_我的小草_11-20章)
          const rawTitle = art.title || art.category_title || "未命名";
          let category = "未分類";
          let bookTitle = rawTitle;

          if (rawTitle.includes("_")) {
            const parts = rawTitle.split("_");
            category = parts[0]; // 第一段為大分類 (如 娛樂)
            bookTitle = parts.slice(1).join("_"); // 後續為書名與範圍
          }

          return {
            id: art.id,
            raw_title: rawTitle,
            category: category,
            book_title: bookTitle,
            is_private: art.is_private === true,
            created_at: art.created_at,
            chapters: parsedChapters
          };
        });

        statusBadge.textContent = "☁️ 已連線雲端資料庫";
        statusBadge.style.color = "#81c784";
        renderArticleList();
      } catch (err) {
        console.error("載入失敗:", err);
        statusBadge.textContent = "⚠️ 資料庫連線失敗";
        statusBadge.style.color = "#e57373";
      }
    }

    // 輔助函式：解析章節
    function parseHtmlToChapters(htmlContent, defaultTitle) {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = htmlContent;
      const elements = Array.from(tempDiv.children);
      let chapters = [];
      let currentChap = { title: defaultTitle, content: "" };

      elements.forEach(el => {
        const text = el.textContent.trim();
        const isChapterHeading = /^第[一二三四五六七八九十百0-9]+章/.test(text) || /^Chapter\s*\d+/i.test(text);

        if (isChapterHeading && currentChap.content.trim() !== "") {
          chapters.push(currentChap);
          currentChap = { title: text, content: "" };
        } else if (isChapterHeading) {
          currentChap.title = text;
        } else {
          currentChap.content += el.outerHTML;
        }
      });

      chapters.push(currentChap);
      if (chapters.length === 0 || (chapters.length === 1 && chapters[0].content === "")) {
        return [{ title: defaultTitle, content: htmlContent }];
      }
      return chapters;
    }

    // -------------------------------------------------------------
    // 4. 渲染左側「三層式」目錄樹
    // -------------------------------------------------------------
    function renderArticleList() {
      articleList.innerHTML = '';
      const visibleArticles = articlesData.filter(art => isUnlocked || !art.is_private);

      if (visibleArticles.length === 0) {
        articleList.innerHTML = '<div style="padding: 15px; color: var(--text-muted); font-size: 0.85rem;">目前沒有可顯示的文章</div>';
        return;
      }

      // 依照大分類 (category) 進行群組歸納
      const groupedByCategory = {};
      visibleArticles.forEach(art => {
        if (!groupedByCategory[art.category]) {
          groupedByCategory[art.category] = [];
        }
        groupedByCategory[art.category].push(art);
      });

      // 產生三層選單 HTML
      for (const [categoryName, books] of Object.entries(groupedByCategory)) {
        const catSection = document.createElement('div');
        catSection.className = 'category-section';

        // 第一層：大分類標題 (例如 📂 娛樂)
        const catHeader = document.createElement('div');
        catHeader.className = 'category-title-bar';
        catHeader.innerHTML = `<span>📁 ${categoryName}</span>`;
        catSection.appendChild(catHeader);

        // 該分類底下的所有書籍/檔案
        books.forEach(art => {
          const bookGroup = document.createElement('div');
          bookGroup.className = 'book-group';

          const isCollapsed = collapsedBooks.has(art.id);

          // 第二層：書名標題 (例如 📘 我的小草_11-20章)
          const bookHeader = document.createElement('div');
          bookHeader.className = 'book-header';
          bookHeader.innerHTML = `
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">📖 ${art.book_title} ${art.is_private ? '🔒' : ''}</span>
            <span style="font-size: 0.7rem; color: var(--text-muted);">${isCollapsed ? '▶' : '▼'}</span>
          `;

          bookHeader.addEventListener('click', () => {
            if (collapsedBooks.has(art.id)) {
              collapsedBooks.delete(art.id);
            } else {
              collapsedBooks.add(art.id);
            }
            renderArticleList();
          });

          // 第三層：章節清單 (第1章, 第2章...)
          const chapterList = document.createElement('div');
          chapterList.className = `chapter-list ${isCollapsed ? 'collapsed' : ''}`;

          art.chapters.forEach((chap, idx) => {
            const chapterItem = document.createElement('div');
            const isActive = art.id === currentArticleId && idx === currentChapterIndex;
            chapterItem.className = `chapter-item ${isActive ? 'active' : ''}`;
            chapterItem.textContent = `📄 ${chap.title || `第 ${idx + 1} 章`}`;

            chapterItem.addEventListener('click', (e) => {
              e.stopPropagation();
              selectChapter(art.id, idx);
            });

            chapterList.appendChild(chapterItem);
          });

          bookGroup.appendChild(bookHeader);
          bookGroup.appendChild(chapterList);
          catSection.appendChild(bookGroup);
        });

        articleList.appendChild(catSection);
      }
    }

    // -------------------------------------------------------------
    // 5. 選擇章節閱讀並更新上方下拉選單
    // -------------------------------------------------------------
    function selectChapter(artId, chapIdx) {
      const art = articlesData.find(a => a.id === artId);
      if (!art || !art.chapters[chapIdx]) return;

      currentArticleId = artId;
      currentChapterIndex = chapIdx;
      renderArticleList();

      const chap = art.chapters[chapIdx];
      currentPath.textContent = `${art.category} / ${art.book_title} /`;

      // 更新上方章節下拉選單
      topChapterSelect.innerHTML = '';
      art.chapters.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = c.title || `第 ${i + 1} 章`;
        if (i === chapIdx) opt.selected = true;
        topChapterSelect.appendChild(opt);
      });
      topChapterSelect.style.display = 'inline-block';

      deleteBtn.style.display = 'inline-block';
      togglePrivateBtn.style.display = 'inline-block';
      togglePrivateBtn.textContent = art.is_private ? "🔓 取消私密標記" : "🔒 設為私密文章";

      const createdDate = art.created_at ? new Date(art.created_at).toLocaleDateString('zh-TW') : "未知日期";

      articleContainer.innerHTML = `
        <div class="article-header">
          <h1 class="article-title">${chap.title}</h1>
          <div class="article-meta">
            <span>📚 分類：${art.category} ＞ ${art.book_title}</span>
            <span>📅 日期：${createdDate}</span>
            ${art.is_private ? '<span class="private-tag">🔒 私密</span>' : ''}
          </div>
        </div>
        <div class="article-body">
          ${chap.content}
        </div>
      `;
    }

    topChapterSelect.addEventListener('change', (e) => {
      const selectedIdx = parseInt(e.target.value);
      if (currentArticleId) {
        selectChapter(currentArticleId, selectedIdx);
      }
    });

    // -------------------------------------------------------------
    // 6. 解鎖私密區
    // -------------------------------------------------------------
    lockToggleBtn.addEventListener('click', () => {
      if (isUnlocked) {
        isUnlocked = false;
        lockToggleBtn.textContent = "🔒 解鎖私密區";
        alert("已上鎖私密區！");
        const currentArt = articlesData.find(a => a.id === currentArticleId);
        if (currentArt && currentArt.is_private) resetReadArea();
        renderArticleList();
      } else {
        const inputPwd = prompt("🔑 請輸入私密區解鎖密碼：");
        if (inputPwd === SECRET_PASSWORD) {
          isUnlocked = true;
          lockToggleBtn.textContent = "🔓 上鎖私密區";
          alert("解鎖成功！");
          renderArticleList();
        } else if (inputPwd !== null) {
          alert("❌ 密碼錯誤！");
        }
      }
    });

    // -------------------------------------------------------------
    // 7. 切換私密狀態
    // -------------------------------------------------------------
    togglePrivateBtn.addEventListener('click', async () => {
      if (!currentArticleId) return;
      const art = articlesData.find(a => a.id === currentArticleId);
      if (!art) return;
      const newPrivateStatus = !art.is_private;

      try {
        const { error } = await dbClient.from('articles').update({ is_private: newPrivateStatus }).eq('id', currentArticleId);
        if (error) throw error;
        art.is_private = newPrivateStatus;
        selectChapter(currentArticleId, currentChapterIndex);
        renderArticleList();
      } catch (err) {
        console.error("更新失敗:", err);
        alert("修改失敗。");
      }
    });

    // -------------------------------------------------------------
    // 8. 匯入 Word (.docx) 檔案
    // -------------------------------------------------------------
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const fileName = file.name.replace(/\.[^/.]+$/, "");

      try {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
        const htmlContent = result.value;

        const chaptersArray = parseHtmlToChapters(htmlContent, fileName);
        const customId = "cat_" + Date.now();

        const payload = {
          id: customId,
          title: fileName,
          category_title: fileName,
          content: htmlContent,
          chapters: chaptersArray,
          is_private: false
        };

        statusBadge.textContent = "⏳ 上傳雲端中...";
        const { error } = await dbClient.from('articles').insert([payload]);
        if (error) throw error;

        // 解析剛上傳的分類與書名
        let category = "未分類";
        let bookTitle = fileName;
        if (fileName.includes("_")) {
          const parts = fileName.split("_");
          category = parts[0];
          bookTitle = parts.slice(1).join("_");
        }

        const addedArt = {
          id: customId,
          raw_title: fileName,
          category: category,
          book_title: bookTitle,
          is_private: false,
          created_at: new Date().toISOString(),
          chapters: chaptersArray
        };

        articlesData.unshift(addedArt);
        renderArticleList();
        selectChapter(addedArt.id, 0);
        statusBadge.textContent = "☁️ 已連線雲端資料庫";
        fileInput.value = '';
      } catch (err) {
        console.error("匯入失敗:", err);
        alert("匯入失敗，請檢查檔案格式。");
        statusBadge.textContent = "☁️ 已連線雲端資料庫";
      }
    });

    // -------------------------------------------------------------
    // 9. 刪除文章
    // -------------------------------------------------------------
    deleteBtn.addEventListener('click', async () => {
      if (!currentArticleId) return;
      if (!confirm("確定要刪除這篇文章嗎？")) return;

      try {
        const { error } = await dbClient.from('articles').delete().eq('id', currentArticleId);
        if (error) throw error;
        articlesData = articlesData.filter(a => a.id !== currentArticleId);
        resetReadArea();
        renderArticleList();
      } catch (err) {
        console.error("刪除失敗:", err);
        alert("刪除失敗。");
      }
    });

    function resetReadArea() {
      currentArticleId = null;
      currentChapterIndex = 0;
      currentPath.textContent = "尚未選擇文章";
      topChapterSelect.style.display = 'none';
      deleteBtn.style.display = 'none';
      togglePrivateBtn.style.display = 'none';
      articleContainer.innerHTML = '<div class="empty-state">請從左側選擇文章閱讀，或點擊匯入 Word 檔案。</div>';
    }
  </script>
</body>
</html>
